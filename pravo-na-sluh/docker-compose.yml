# Локальный запуск production-сборки с PostgreSQL: docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pravo
      POSTGRES_USER: pravo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pravo"]
      interval: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://pravo:${POSTGRES_PASSWORD:-change-me}@db:5432/pravo
      PORT: 8080
    ports:
      - "8080:8080"
    volumes:
      - ./storage/audio:/app/storage/audio:ro
    restart: unless-stopped

volumes:
  pgdata:
