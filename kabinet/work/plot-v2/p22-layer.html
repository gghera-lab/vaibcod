<script id="p22-plot-js">
(() => {
  /* ---------- состояние ---------- */
  const LINES = [['ks', 'Конституционный суд'], ['vs', 'Верховный суд'], ['duma', 'Дума'], ['sf', 'Совет Федерации'], ['pro', 'Прокуратура'], ['hvost', '«Вечерний Хвост»'], ['izb', 'Избирком'], ['ul', 'Улица']];
  // какая строка гаснет, когда окружение спасает от провала по этому показателю
  const LINE_OF = { kz: 'pro', dv: 'ul', sv: 'hvost', bz: 'sf', ek: 'vs', el: 'duma', pr: 'izb', kr: 'pro', zd: 'ks', mo: 'sf' };
  const P22 = (S) => { if (!S.p22) S.p22 = { prec: 0, off: [], res: {}, att: [], attP: 0, clean: {}, coerce3: 0, night: null, log: [] }; return S.p22; };
  const alive = (S) => LINES.length - P22(S).off.length;
  const note = (S, t) => { const p = P22(S); p.log.push(`${S.term}·${S.week}: ${t}`); if (p.log.length > 40) p.log.shift(); };
  const prec = (S, d, why) => { P22(S).prec += d; note(S, `прецедент ${d > 0 ? '+' : ''}${d} — ${why}`); };
  function gash(S, k, forced) {
    const p = P22(S); let id = forced || LINE_OF[k];
    if (forced && p.off.includes(forced)) return null;
    if (!id || p.off.includes(id)) id = (LINES.find(([x]) => !p.off.includes(x)) || [])[0];
    if (!id) { prec(S, -1, 'гасить больше нечего'); return null; }
    p.off.push(id); const n = LINES.find(([x]) => x === id)[1]; note(S, `погасла строка: ${n}`);
    try { toast(`Погасла строка: ${n}`); } catch (e) {}
    return n;
  }

  /* ---------- «На волоске»: в I–II проиграть нельзя, но каждое следующее спасение дороже ---------- */
  function rescued(S, end) {
    const p = P22(S); const n = p.res[S.term] = (p.res[S.term] || 0) + 1; const k = (RESCUE_FIX[end] || [])[0];
    note(S, `спасение № ${n} в сроке ${S.term}`);
    if (n >= 2) gash(S, k);
    if (n >= 3) prec(S, -1, `${n}-е спасение за срок`);
    if (n >= 4) { p.coerce3++; if (!hasF(S, 'p22_tenhand')) S.flags.push('p22_tenhand'); note(S, '+1 принуждение в III сроке; следующий срок начнётся с Тени'); }
  }
  const SC22 = secondCard;
  secondCard = function (S, end) {
    const scr = SC22.apply(this, arguments);
    if (!IS8(S) || S.term > 2 || !RESCUE_FIX[end]) return scr;
    const E = ENDINGS[end] ? ENDINGS[end].t : end; const n = (P22(S).res[S.term] || 0) + 1;
    const shadow = { l: 'Полковник Тень: «Особый режим. До утра»', p22res: end, imm: 1 };
    const c = scr && scr.card ? Object.assign({}, scr.card) : { id: 'p22res:' + S.term + ':' + end, _second: 1, type: 'office', who: 'ten', f: 0, sev: 3, noBan: 1, nolock: 1, br: 'vl',
      x: `«${E}» — вот что будет утром. Звонков больше нет, денег не хватит. Тень молча кладёт на стол указ об особом режиме.`, o: [] };
    let o = (c.o || []).filter(x => !x.end);
    if (!o.length) o = [shadow];
    c.o = o; c.t = 'На волоске';
    c.d = ['В I–II сроке проиграть нельзя: утро наступит. Но каждое следующее спасение стоит дороже.', n >= 2 ? 'Это спасение погасит одну строку в листе сдержек.' : 'Первое спасение за срок — без гашения строки.'];
    let s2 = cardScreen(S, c); s2.second = end;
    if (!(s2.avail || []).some(Boolean) && !o.includes(shadow)) { c.o = o.concat([shadow]); s2 = cardScreen(S, c); s2.second = end; }
    return s2;
  };
  const CH22 = choose;
  choose = function (S, scr, i) {
    const o = scr && scr.kind === 'card' && scr.card && scr.card.o ? scr.card.o[i] : null;
    if (o && o.p22res && IS8(S)) {
      const [k, v] = RESCUE_FIX[o.p22res]; S.st[k] = v;
      const applied = applyEffects(S, { kr: 3, sv: -5, dv: -3 }, 'Особый режим', true);
      try { karmaAdd(S, -25); } catch (e) {}
      try { ldAdd9(S, 'На волоске: особый режим Тени', 'ten', scr.card, 'forced'); } catch (e) {}
      rescued(S, o.p22res); advance(S, 0);
      return { applied, votes: [], kind: 'card', big: 1, delayed: false, end: S.ended || checkEnd(S) };
    }
    const isRes = !!(o && scr.second && IS8(S) && S.term <= 2 && (o.rescue8 || o.rescue9));
    const r = CH22.apply(this, arguments);
    if (isRes) rescued(S, scr.second);
    return r;
  };

  /* ---------- чистый срок: ни одной записи своей рукой ---------- */
  const NT22 = nextTerm;
  nextTerm = function (S0) {
    try { if (IS8(S0) && S0.term <= 2 && !P22(S0).clean[S0.term]) { P22(S0).clean[S0.term] = 1; if (!ldTermN9(S0)) prec(S0, 1, `чистый срок ${S0.term}`); } } catch (e) {}
    return NT22.apply(this, arguments);
  };

  /* ---------- перехваты: уход в I–II не отменяет выбор, а записывается как «ПОПЫТКА» ---------- */
  const EXIT = { p8_quiet: 'Заявление', resign_term: 'Заявление', lost_honest: 'Утро после выборов', lost_election: 'Утро после выборов', fals_fail: 'Утро после выборов',
    one_term: 'Сейф', two_terms: 'Строчку вписали без вас', p9_two_honest: 'Строчку вписали без вас', tandem: 'Второе чтение' };
  const EXIT_X = {
    'Заявление': 'Заявление об отставке так и не дошло до Совета Федерации. Утром правая рука кладёт его вам обратно на стол: «Вы устали. Это пройдёт».',
    'Утро после выборов': 'К утру итог переписан. Председатель избиркома поздравляет вас по телефону, не дожидаясь вопроса.',
    'Сейф': 'Ваши вещи уже собраны, но сейф с документами не открывается. «Без вас тут всё развалится», — говорят те, кто знает код.',
    'Строчку вписали без вас': 'Во втором чтении в поправку вписали одну строчку. Вы её не вносили. Ваши прежние сроки больше не считаются.',
    'Второе чтение': 'Во втором чтении в поправку вписали одну строчку. Вы её не вносили.'
  };
  function intercept(id) {
    const p = P22(S); const t = EXIT[id]; p.att.push({ term: S.term, id, t }); note(S, `перехват: ${t} (${id})`);
    if (!p.attP) { p.attP = 1; prec(S, 1, 'попытка уйти'); }
    try { ldAdd9(S, `ПОПЫТКА: ${(ENDINGS[id] || {}).t || id}`, 'pr', null, 'forced'); } catch (e) {}
    const first = p.att.length === 1;
    setScene({ bg: 'pov', who: null, mode: 'end' });
    const box = $('end'); box.hidden = false;
    box.innerHTML = `<div class="trailer"><div class="tr-in"><div class="b18 p22n"><small>${S.term} СРОК · ПЕРЕХВАТ</small><h2>${esc(t)}</h2><div class="p22stamp">ПЕРЕХВАЧЕНО</div>
      <p>Вы выбрали: «${esc((ENDINGS[id] || {}).t || id)}».</p><p>${esc(EXIT_X[t])}</p>
      ${first ? '<p class="p22line">Вы хотели уйти. Это запомнят — и не только они. Ваш выбор лёг в дело записью «ПОПЫТКА» и сработает в ночь 4:12.</p>' : '<p class="p22line">Ещё одна попытка. Её тоже запомнят.</p>'}
      <div class="p22btns"><button class="bigbtn" id="p22go">Дальше</button></div></div></div></div>`;
    try { AU.sfx('stamp'); } catch (e) {}
    $('p22go').onclick = () => {
      S.ended = null; S.finalEnd = null; box.hidden = true;
      if (S.week > TURNS(S) || /^(one_term|two_terms|p9_two_honest|tandem)$/.test(id)) {
        if (S.term === 2 && !hasF(S, 'zero_ok')) S.flags.push('zero_ok', 'p22_line');
        nextTerm(S); try { store.set(ckptKey(S.term), S); } catch (e) {}
      }
      saveGame(); updTop(); try { updDesk(); } catch (e) {} next();
    };
  }

  /* ---------- ночь 4:12: любой конец III срока, включая проигрыши ---------- */
  const EARLY = { p9_collapse3: ['министр финансов', 'приносит заявление об отставке «по состоянию экономики»'], war9: ['начальник Генштаба', 'держит приказ о наступлении'],
    health: ['начальник охраны', 'решает, кого пустить к вашей постели'], impeach_kr: ['генеральный прокурор', 'ждёт в приёмной с делом'], impeach: ['комендант', 'должен вывести вас из кабинета'] };
  const PATH = { p9_final_tigr: ['пульт', 'охранник у пульта вентиляции'], p8_final: ['пульт', 'начальник смены бункера'], term4_up: ['пульт', 'начальник смены бункера'], term4_done: ['пульт', 'начальник смены бункера'],
    fin_honest: ['протокол', 'председатель избиркома'], fin_forever: ['протокол', 'председатель избиркома'], fin_resign: ['протокол', 'председатель избиркома'] };
  const ITEM = { пульт: 'пульт с одной кнопкой', протокол: 'протокол итогов и ручка', телефон: 'телефон с длинными гудками', лист: 'лист с факсимиле вашей подписи' };
  const kotovTrust = (S) => !hasF(S, 'hero_gone') && !hasF(S, 'hero_burned') && !hasF(S, 'hero_exiled');
  function verdict(S) { const P = P22(S).prec, C = alive(S);
    if (P >= 4) return 'refuse'; if (P >= 1) return C >= 4 ? 'refuse' : 'call'; return C > 2 ? 'call0' : 'obey'; }
  function night(id, done) {
    const p = P22(S); const E = ENDINGS[id] || { t: id }; const early = EARLY[id];
    if (!p.clean[3] && !(S.ld || []).some(x => x.kind !== 'kurs' && x.kind !== 'forced' && x.term >= 3)) { p.clean[3] = 1; prec(S, 1, 'чистый III срок'); }
    const [item, who] = early ? ['лист', early[0]] : (PATH[id] || ['телефон', 'начальник охраны']);
    const box = $('end'); setScene({ bg: 'pov', who: null, mode: 'end' }); box.hidden = false;
    const frame = (small, h, body, btns) => { box.innerHTML = `<div class="trailer"><div class="tr-in"><div class="b18 p22n"><small>${small}</small><h2>${h}</h2>${body}<div class="p22btns">${btns}</div></div></div></div>`; };
    // 1 · перекличка
    const att = p.att.length ? `<p>Вы пытались уйти: ${p.att.map(a => `в ${a.term} сроке («${esc(a.t)}»)`).join(', ')}.</p>` : '';
    frame('НОЧЬ · 4:12 · ПЕРЕКЛИЧКА', early ? 'Ночь наступила раньше' : '4:12',
      `<p>${early ? `«${esc(E.t)}». За вами пришли не утром, а сейчас.` : 'Последняя ночь третьего срока. На столе — те, кто ещё может вас остановить.'}</p>
       <ul>${LINES.map(([k, n]) => `<li class="${p.off.includes(k) ? 'off' : ''}">${p.off.includes(k) ? '○' : '●'} ${esc(n)}</li>`).join('')}</ul>${att}`,
      '<button class="bigbtn" id="p22n1">Дальше</button>');
    try { AU.sfx('page'); } catch (e) {}
    $('p22n1').onclick = () => {
      // 2 · приказ
      frame('НОЧЬ · 4:12 · ПРИКАЗ', 'Приказ', `<p>На столе — ${esc(ITEM[item])}.</p><p>${early ? `Тот, кто пришёл, держит вашу подпись: ${esc(early[0])} ${esc(early[1])}.` : `Приказ подписан вашим факсимиле. Исполнять его будет ${esc(who)}.`}</p>`,
        '<button class="bigbtn" id="p22n2">Дальше</button>');
      $('p22n2').onclick = () => {

    <rect x="7" y="13" width="8" height="5" fill="#e8c14b"/><rect x="7" y="13" width="8" height="1" fill="#fff1a8"/><rect x="16" y="14" width="8" height="4" fill="#d4a93a"/><rect x="11" y="10" width="8" height="3" fill="#e8c14b"/>
    <rect x="7" y="29" width="12" height="6" fill="#4f8a4a"/><rect x="7" y="29" width="12" height="1" fill="#7fbf6f"/><rect x="9" y="27" width="12" height="3" fill="#5f9a56"/><rect x="21" y="30" width="6" height="5" fill="#d8d0bc"/>
    <rect x="32" y="4" width="13" height="34" fill="#3a3f48"/><rect x="32" y="4" width="13" height="2" fill="#59606c"/><rect x="34" y="8" width="9" height="26" fill="#2b2f36"/>
    <rect x="36" y="16" width="5" height="5" fill="#9aa2ad"/><rect x="38" y="17" width="1" height="3" fill="#2b2f36"/><rect x="2" y="40" width="4" height="3" fill="#16181c"/><rect x="28" y="40" width="4" height="3" fill="#16181c"/></svg>`;
  function safeInit() {
    const sw = $('screenwrap'), d = $('desk'), left = $('left'); if (!sw || !d || !left || $('p22safeBtn')) return;
    const hold = document.createElement('div'); hold.id = 'p22hold'; hold.hidden = true; left.appendChild(hold); hold.appendChild(d);
    const b = document.createElement('button'); b.id = 'p22safeBtn'; b.type = 'button'; b.title = 'Сейф: личные деньги, покупки, бизнес, угроза';
    b.innerHTML = SAFE_SVG + '<span>Сейф</span>'; (sw.querySelector('.stg13') || sw).appendChild(b); // внутри сцены: едет вместе с камерой
    b.addEventListener('click', (e) => { e.stopPropagation(); openSafe(); });
  }
  function openSafe() {
    if (!S) return; try { AU.sfx('page'); } catch (e) {}
    openModal('Сейф', '<div id="p22safe"></div>');
    const box = $('p22safe'), d = $('desk'); if (box && d) { box.appendChild(d); try { updDesk(); } catch (e) {} }
  }
  const CM22 = closeModal;
  closeModal = function () { const d = $('desk'), h = $('p22hold'); if (d && h && d.parentElement !== h) h.appendChild(d); return CM22.apply(this, arguments); };
  safeInit();
  // сейф висит только в кабинете (там, где была картина), не в зале, на улице и т. п.
  setInterval(() => { const b = $("p22safeBtn"); if (!b) return; const on = !!S && typeof SC !== "undefined" && ["office", "pov"].includes(SC.bg); if (b.hidden === on) b.hidden = !on; }, 300);

  /* ---------- 22b · награждение: кружок на груди тоже прикалывает орден, после — «Приколоть» серая ---------- */
  document.addEventListener('click', (e) => {
    const z = e.target.closest && e.target.closest('#awzone, .aw10hall'); const q = $('awq');
    if (z && q && !q.disabled) { e.stopPropagation(); q.click(); }
  }, true);
  setInterval(() => { const pn = $('awpinned'), q = $('awq'); if (pn && q && pn.classList.contains('on') && !q.disabled) { q.disabled = true; q.classList.add('p22off'); } }, 250);

  /* ---------- 22c · обучение в каждой новой партии; последний шаг — сейф ---------- */
  // список шагов спрятан в модуле игры: шаг «Покупки» ищет '#desk .m19buy' — пока идёт обучение, невидимая панель лежит ровно на сейфе
  const TOUR_SAFE = 'Сейф на стене — ваши личные деньги, покупки (охрана, броня, дегустатор), бизнес и угроза. Нажмите на сейф, чтобы открыть.';
  setInterval(() => { try {
    const t19 = $('t19'), d = $('desk'), hold = $('p22hold'), stg = document.querySelector('#screenwrap .stg13'); if (!t19 || !d || !hold || !stg) return;
    const on = !t19.hidden;
    if (on && d.parentElement === hold) { d.classList.add('p22ghost'); stg.appendChild(d); }
    else if (!on && d.classList.contains('p22ghost')) { d.classList.remove('p22ghost'); if (d.parentElement === stg) hold.appendChild(d); }
    const tt = t19.querySelector('.t19t'), tx = t19.querySelector('.t19x');
    if (tt && tt.textContent === 'Покупки') { tt.textContent = 'Сейф'; if (tx) tx.textContent = TOUR_SAFE; }
  } catch (e) {} }, 100);
  // новая партия (у состояния ещё нет отметки) — обучение снова взводится
  setInterval(() => { try { if (S && IS8(S) && S.term === 1) { const p = P22(S); if (!p.tourArm) { p.tourArm = 1; if (!window.P22_NOTOUR) PREF.tour19 = 0; } } } catch (e) {} }, 500);

  /* ---------- 22d · кадр как в игре: сцена заполняет всю область (своя логика кадра убрана по просьбе пользователя) ---------- */

  /* ---------- 22e · Котов после ссылки больше не появляется в сценах ---------- */
  const KFIX = (s) => typeof s !== 'string' ? s : s.replace(/капитан(а|у|ом|е)?\s+(?:Тимофе\S+\s+)?Котов(а|у|ым|е)?/g, 'майор$1 Бакенбардов$2')
    .replace(/Котов(а|у|ым|е)?(?![а-яё])/g, 'Бакенбардов$1').replace(/По-капитански/g, 'По-уставному');
  try { const aw = CARD('p9_aw1_hero'); if (aw) aw.not = [].concat(aw.not || [], 'hero_exiled'); } catch (e) {}
  const CSK = cardScreen;
  cardScreen = function (S, c) {
    try { if (c && IS8(S) && hasF(S, 'hero_exiled') && /^p9_(sit_|aw1_vil|gov$)/.test(String(c.id))) {
      const sit = /^p9_sit_/.test(c.id); const k = Object.assign({}, c);
      if (k.cast) k.cast = k.cast.filter(x => x !== 'hero9');
      if (k.lines) k.lines = k.lines.filter(l => l && l[0] !== 'hero9').map(l => [l[0], sit ? KFIX(l[1]) : l[1]]);
      if (sit) { k.x = KFIX(k.x); if (k.xf) { const f = c.xf; k.xf = (s) => KFIX(f(s)); } if (Array.isArray(k.d)) k.d = k.d.map(KFIX); k.o = (k.o || []).map(o => Object.assign({}, o, { l: KFIX(o.l) })); }
      else k.o = (k.o || []).filter(o => !/Котов/.test(o.l || ''));
      if (k.o.length) arguments[1] = k;
    } } catch (e) {}
    return CSK.apply(this, arguments);
  };

  /* ---------- 22e · двойной клик во время смены карточки: подтверждение без карточки тихо игнорируется ---------- */
  const CI22 = confirmInner;
  confirmInner = function (i) { const s = U.scr; if (!s || !s.card || !s.card.o || !s.card.o[i]) { U.busy = false; return Promise.resolve(); } return CI22.apply(this, arguments); };

  // страховка: если внутренняя обёртка подтверждения упала на уже сменившейся карточке — не держать интерфейс «занятым»
  window.addEventListener('unhandledrejection', (e) => { try { const r = e.reason, m = String(r && r.message), st = String(r && r.stack); if (/confirmInner/.test(st) && /reading '(card|o|act)'/.test(m)) { e.preventDefault(); U.busy = false; } } catch (x) {} });

  /* ---------- тестовая панель: видно скрытые числа ---------- */
  function panel() {
    let pn = $('p22panel'); if (!pn) return; if (!S || !S.p22) { pn.innerHTML = 'Пакет 22: игра ещё не начата.'; return; }
    const p = S.p22;
    pn.innerHTML = `<b>Тест сюжета v2</b><br>Срок ${S.term}, неделя ${S.week}<br>Прецедент: <b>${p.prec}</b><br>Живых строк: <b>${alive(S)}</b> из 8<br>
      ${LINES.map(([k, n]) => `<span class="${p.off.includes(k) ? 'off' : ''}">${esc(n)}</span>`).join(' · ')}<br>
      Спасения: I — ${p.res[1] || 0}, II — ${p.res[2] || 0}<br>Попытки уйти: ${p.att.length}<br>Принуждений в III: +${p.coerce3}<br>
      Котов доверяет: ${kotovTrust(S) ? 'да' : 'нет'}<br>Исполнитель сейчас: <b>${({ refuse: 'откажется', call: 'колеблется (звонок Котову)', call0: 'колеблется (звонок Котову)', obey: 'подчинится' })[verdict(S)]}</b><br>
      ${p.night ? `4:12: ${esc(p.night.who)} — ${p.night.res === 'refuse' ? 'отказ' : 'исполнил'}<br>` : ''}<br><i>Журнал:</i><br>${p.log.slice(-12).map(esc).join('<br>')}`;
  }
  const chip = document.createElement('button'); chip.id = 'p22chip'; chip.type = 'button'; chip.textContent = 'ТЕСТ v2'; chip.title = 'Сюжет трёх сроков v2: скрытые числа';
  chip.onclick = (e) => { e.stopPropagation(); let pn = $('p22panel'); if (pn) { pn.remove(); return; } pn = document.createElement('div'); pn.id = 'p22panel'; document.body.appendChild(pn); panel(); };
  document.body.appendChild(chip);
  setInterval(() => { if ($('p22panel')) panel(); }, 1000);
  document.title = 'Кабинет · тест сюжета v2';
  window.P22API = { P22, alive, verdict, LINES };
})();
